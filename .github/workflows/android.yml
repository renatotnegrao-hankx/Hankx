name: Android (APK e AAB sem assinatura)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Compilar
        run: gradle -p android assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Separar arquivos
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/*.apk dist/hankx-unsigned.apk
          cp android/app/build/outputs/bundle/release/*.aab dist/hankx-unsigned.aab
          ls -la dist
      - name: Publicar como release (sem assinatura)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete android-build -y --cleanup-tag || true
          gh release create android-build dist/* --prerelease --title "Android build ${{ github.run_number }}" --notes "APK/AAB sem assinatura, gerados automaticamente."
