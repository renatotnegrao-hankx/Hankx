# Gera o app Android (.aab) do HANKX Finanças para enviar à Play Store.
# Roda sozinho quando algo na pasta android/ muda, ou pelo botão "Run workflow" na aba Actions.
# O arquivo pronto aparece em "Releases" (lado direito da página do repositório).
name: App Android (.aab)

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Gerar projeto Android
        run: |
          mkdir -p /tmp/bw && cd /tmp/bw && npm init -y >/dev/null && npm i @bubblewrap/core@1 --silent
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/bw/node_modules node android/gerar-projeto.js build ${{ github.run_number }}

      - name: Preparar chave de assinatura
        env:
          SENHA: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SENHA" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/upload.keystore.enc -out build/upload.keystore -pass env:SENHA
            echo "OFICIAL=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Segredo ANDROID_KEYSTORE_PASSWORD não cadastrado: gerando só um .aab de TESTE (não serve para a Play Store)."
            SENHA=teste123456
            keytool -genkeypair -keystore build/upload.keystore -alias hankx -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SENHA" -keypass "$SENHA" -dname "CN=Teste, O=HANKX, C=BR"
            echo "OFICIAL=0" >> "$GITHUB_ENV"
          fi
          echo "SENHA_KS=$SENHA" >> "$GITHUB_ENV"
          echo "::add-mask::$SENHA"

      - name: Compilar
        working-directory: build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Assinar
        working-directory: build
        run: |
          jarsigner -keystore upload.keystore -storepass "$SENHA_KS" -keypass "$SENHA_KS" \
            -signedjar ../hankx-financas-${{ github.run_number }}.aab app/build/outputs/bundle/release/app-release.aab hankx
          jarsigner -verify ../hankx-financas-${{ github.run_number }}.aab | tail -1
          rm -f upload.keystore

      - name: Publicar em Releases
        if: env.OFICIAL == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" "hankx-financas-${{ github.run_number }}.aab" \
            --title "App Android — versão 1.0.${{ github.run_number }}" \
            --notes "Arquivo .aab assinado para enviar à Play Store (Play Console → Testes → Teste fechado → Criar versão)."

      - name: Guardar .aab de teste
        if: env.OFICIAL != '1'
        uses: actions/upload-artifact@v4
        with:
          name: aab-de-teste
          path: hankx-financas-*.aab
